name: CI / CD

# Tests + cfn-lint gate every push and PR. A push to main that passes the gate
# then deploys the discharge-audit stack via short-lived OIDC credentials
# (no long-lived AWS keys in GitHub). See docs/CICD.md for the one-time role setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests + lint
    # Runner image pinned, not ubuntu-latest: -latest moves to Ubuntu 26 from
    # 19 Oct 2026, and an image change is a build-environment change nobody
    # reviewed. Actions on node24 majors: GitHub forces Node 20 actions onto
    # Node 24 anyway; these majors are built for it (ADR-009 Owed, W2).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: pip install --quiet pytest boto3 cfn-lint

      - name: Unit tests (mocked AWS — no credentials needed)
        run: python -m pytest tests/ -q

      - name: Canary scenario bundle is current
        run: python src/canary/build_scenarios.py --check

      - name: Lint CloudFormation templates
        # Warnings (e.g. the deliberate DependsOn-on-log-group W3005, and the
        # expected "needs package CLI" W3002) are printed but do not fail the
        # build; only genuine errors break CI.
        run: cfn-lint --non-zero-exit-code error infra/template.yaml infra/web-template.yaml

  deploy:
    name: Deploy discharge-audit (OIDC)
    needs: test
    # Only on a direct push to main — never on PRs or manual test runs from forks.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write   # mint the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::061051247394:role/GitHubActionsDischargeDeploy
          aws-region: eu-west-2

      - name: Package
        working-directory: infra
        run: |
          aws cloudformation package \
            --template-file template.yaml \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-xufyv0yd8kla \
            --output-template-file packaged.yaml

      # Every parameter whose live value matters is pinned here, not left to
      # the stack. `aws cloudformation deploy` KEEPS a parameter's previous
      # value when it is not overridden - so a value set once by hand
      # (PromptCaching=on was, found 24 Sep 2026) persists invisibly, and a
      # changed template Default never reaches the live stack. Pinning makes
      # the live configuration readable from this file. ModelId is pinned so
      # a model change is a visible diff here (HAZ-10). LedgerRetentionDays:
      # 183 days - see docs/ADR-phase1.md ADR-009, W1 change set.
      - name: Deploy
        working-directory: infra
        run: |
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name discharge-audit \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=demo \
              ModelId=anthropic.claude-sonnet-4-6 \
              PatientV2SecondPass=on \
              PromptCaching=on \
              LedgerRetentionDays=183 \
              CanaryEnabled=on \
              CanaryMaxConcurrency=4 \
              AlertEmail=${{ vars.ALERT_EMAIL }} \
            --region eu-west-2 \
            --no-fail-on-empty-changeset
