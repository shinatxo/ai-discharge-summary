Outputs:
  BucketName:
    Value: !Ref Bucket
  BucketOwner:
    Value: !Ref AWS::AccountId
  KeyArn:
    Value: !GetAtt Key.Arn
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  TaskDefinitionArn:
    Condition: HasImage
    Value: !Ref TaskDefinition
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  SubnetId:
    Value: !Ref PublicSubnet
  SecurityGroupId:
    Value: !GetAtt TaskSecurityGroup.GroupId
  TaskLogGroupName:
    Value: !Ref TaskLogGroup
  ScheduleGroupName:
    Value: !Ref ScheduleGroup
  ExpectedPipelineParameter:
    Value: !Ref ExpectedPipeline
  ExpectedV1Parameter:
    Value: !Ref ExpectedV1
